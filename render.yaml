# Render Blueprint — creazione automatica di web service + database Postgres.
# Su Render: New -> Blueprint -> collega il repository con questo file.
databases:
  - name: filo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16

services:
  - type: web
    name: filo-chat
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: filo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
